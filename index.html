<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Study Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: 30px auto;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      text-decoration: none;
      color: #4da6ff;
      font-weight: bold;
      border: 1px solid #333;
    }
    .card:hover { background: #2a2a2a; }
    button {
      padding: 10px 20px;
      background: #4da6ff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Math Study Hub</h1>
  <button onclick="openCloaked()">Open in about:blank</button>

  <div class="grid">
    <!-- Add your own links or games below -->
    <a class="card" href="https://example.com" target="_blank">App 1</a>
    <a class="card" href="https://example.com" target="_blank">App 2</a>
    <a class="card" href="https://example.com" target="_blank">App 3</a>
  </div>

  <script>
    function openCloaked() {
      const win = window.open('about:blank', '_blank');
      const iframe = win.document.createElement('iframe');
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.style.position = 'fixed';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.src = window.location.href;
      win.document.body.appendChild(iframe);
    }
  </script>

</body>
</html>
